name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Nextflow + R + Python
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with: { version: "24.04.4" }
      - name: nf-core lint
        run: |
          pip install nf-core==2.14.1
          nf-core lint --release || true
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: "4.4.1" }
      - name: lintr
        run: |
          Rscript -e 'install.packages("lintr", repos="https://cloud.r-project.org")'
          Rscript -e 'lintr::lint_dir("scripts/R")' || true
      - name: ruff
        run: |
          pip install ruff==0.5.5
          ruff check scripts/python || true

  test-run:
    name: End-to-end test profile (CPU)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: nf-core/setup-nextflow@v2
        with: { version: "24.04.4" }
      - name: Run pipeline on test profile
        run: nextflow run main.nf -profile test,docker --outdir results/ci
      - name: Assert expected outputs exist
        run: |
          test -f results/ci/bulk/concordance.pdf
          test -f results/ci/de/venn.pdf
          test -f results/ci/sc/umap_cpu.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ci-results, path: results/ci/ }