<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="-apple-system, Helvetica, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .lane    { fill: #f7f9fb; stroke: #cfd8dc; stroke-width: 1; }
      .lane-t  { fill: #455a64; font-weight: 600; font-size: 11px; }
      .box     { fill: #ffffff; stroke: #455a64; stroke-width: 1.4; rx: 6; ry: 6; }
      .accent  { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.4; rx: 6; ry: 6; }
      .gpu     { fill: #ffebee; stroke: #c62828; stroke-width: 1.4; rx: 6; ry: 6; }
      .input   { fill: #fff9c4; stroke: #f9a825; stroke-width: 1.4; rx: 6; ry: 6; }
      .output  { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.4; rx: 6; ry: 6; }
      .edge    { stroke: #444; stroke-width: 1.1; fill: none; marker-end: url(#arrow); }
      .label   { fill: #263238; }
      .small   { fill: #607d8b; font-size: 10px; }
    </style>
  </defs>

  <text x="14" y="22" font-size="15" font-weight="700" fill="#263238">
    KazRNA-Pipe v1.0.0 - workflow architecture
  </text>
  <text x="14" y="38" class="small">Nextflow DSL2 · Singularity 3.11 · SLURM / AWS Batch · GitHub Actions CI</text>

  <!-- Lanes -->
  <rect x="10"  y="56"  width="880" height="80"  class="lane"/>
  <text x="20"  y="74"  class="lane-t">INPUTS &amp; PROVENANCE</text>
  <rect x="10"  y="146" width="880" height="160" class="lane"/>
  <text x="20"  y="164" class="lane-t">PROCESSING</text>
  <rect x="10"  y="316" width="880" height="130" class="lane"/>
  <text x="20"  y="334" class="lane-t">INTEGRATION &amp; CONCORDANCE</text>
  <rect x="10"  y="456" width="880" height="70"  class="lane"/>
  <text x="20"  y="474" class="lane-t">OUTPUTS</text>

  <!-- Inputs -->
  <rect x="40"  y="86" width="160" height="40" class="input"/>
  <text x="50"  y="103">PRJNA608223 (22 bulk)</text>
  <text x="50"  y="118" class="small">SHA-256 manifest 2025-11-03</text>

  <rect x="220" y="86" width="160" height="40" class="input"/>
  <text x="230" y="103">GSE160269 (208k cells)</text>
  <text x="230" y="118" class="small">SHA-256 manifest 2025-11-03</text>

  <rect x="400" y="86" width="160" height="40" class="input"/>
  <text x="410" y="103">TCGA-ESCA (n=80)</text>
  <text x="410" y="118" class="small">GDC DR 41.0, query JSON</text>

  <rect x="580" y="86" width="160" height="40" class="input"/>
  <text x="590" y="103">GTEx v8 esophagus</text>
  <text x="590" y="118" class="small">555 normals, GTEx Portal</text>

  <rect x="760" y="86" width="120" height="40" class="input"/>
  <text x="770" y="103">GENCODE v44</text>
  <text x="770" y="118" class="small">GRCh38.p14, indices</text>

  <!-- Processing -->
  <rect x="40"  y="184" width="140" height="40" class="box"/>
  <text x="50"  y="200">FastQC · TrimGalore</text>
  <text x="50"  y="215" class="small">QC, adapter trim</text>

  <rect x="40"  y="240" width="140" height="40" class="box"/>
  <text x="50"  y="256">STAR·HISAT2·Salmon</text>
  <text x="50"  y="271" class="small">3 aligners, decoy-aware</text>

  <rect x="200" y="240" width="160" height="40" class="accent"/>
  <text x="210" y="256">DESeq2/edgeR/limma-voom</text>
  <text x="210" y="271" class="small">3 DE methods, age+sex adj.</text>

  <rect x="380" y="184" width="160" height="40" class="box"/>
  <text x="390" y="200">Seurat v5.1 (CPU)</text>
  <text x="390" y="215" class="small">SCTransform · Leiden · UMAP</text>

  <rect x="380" y="240" width="160" height="40" class="gpu"/>
  <text x="390" y="256">rapids-singlecell (GPU)</text>
  <text x="390" y="271" class="small">cudf · cuml · 14.3× speed-up</text>

  <rect x="560" y="184" width="140" height="40" class="box"/>
  <text x="570" y="200">BayesPrism · MuSiC</text>
  <text x="570" y="215" class="small">Bulk → cell-type proportions</text>

  <rect x="560" y="240" width="140" height="40" class="box"/>
  <text x="570" y="256">CIBERSORTx (opt.)</text>
  <text x="570" y="271" class="small">token-gated, not bundled</text>

  <rect x="720" y="212" width="160" height="40" class="box"/>
  <text x="730" y="228">clusterProfiler</text>
  <text x="730" y="243" class="small">KEGG · GO BP enrichment</text>

  <!-- Integration -->
  <rect x="40"  y="354" width="200" height="40" class="accent"/>
  <text x="50"  y="370">Cross-aligner Spearman</text>
  <text x="50"  y="385" class="small">ρ ≥ 0.94 across STAR/HISAT2/Salmon</text>

  <rect x="260" y="354" width="200" height="40" class="accent"/>
  <text x="270" y="370">Cross-method DEG Venn</text>
  <text x="270" y="385" class="small">74% three-way concordance</text>

  <rect x="480" y="354" width="200" height="40" class="accent"/>
  <text x="490" y="370">CPU↔GPU agreement</text>
  <text x="490" y="385" class="small">ARI=0.947 @ Leiden res 1.0</text>

  <rect x="700" y="354" width="180" height="40" class="accent"/>
  <text x="710" y="370">Deconvolver corr.</text>
  <text x="710" y="385" class="small">3-way Pearson r</text>

  <rect x="40"  y="402" width="280" height="36" class="accent"/>
  <text x="50"  y="425">Cell-type-resolved DE - pseudo-bulk DESeq2</text>

  <rect x="340" y="402" width="280" height="36" class="accent"/>
  <text x="350" y="425">HPC scaling + energy benchmark</text>

  <!-- Outputs -->
  <rect x="40"  y="478" width="180" height="40" class="output"/>
  <text x="50"  y="495">software_versions.yml</text>
  <text x="50"  y="510" class="small">every tool, every process</text>

  <rect x="240" y="478" width="180" height="40" class="output"/>
  <text x="250" y="495">*_provenance.json</text>
  <text x="250" y="510" class="small">per task: tool, seed, inputs</text>

  <rect x="440" y="478" width="180" height="40" class="output"/>
  <text x="450" y="495">MultiQC report</text>
  <text x="450" y="510" class="small">aggregated QC HTML</text>

  <!-- Edges (inputs -> processing) -->
  <path class="edge" d="M120,126 V184"/>
  <path class="edge" d="M300,126 V184"/>
  <path class="edge" d="M480,126 V184"/>
  <path class="edge" d="M660,126 V184"/>
  <path class="edge" d="M820,126 V184"/>

  <!-- Processing internal flow -->
  <path class="edge" d="M180,260 H200"/>

  <!-- Processing -> integration -->
  <path class="edge" d="M280,280 V354"/>
  <path class="edge" d="M460,280 V354"/>
  <path class="edge" d="M630,280 V354"/>
  <path class="edge" d="M780,252 V354"/>

  <!-- Integration -> outputs -->
  <path class="edge" d="M180,438 V478"/>
  <path class="edge" d="M340,438 V478"/>
  <path class="edge" d="M540,438 V478"/>
</svg>
