# data/celltype_markers.yaml
#
# Marker panels for ESCC scRNA-seq cell-type assignment. Used by both Seurat
# (AddModuleScore) and rapids-singlecell (sc.tl.score_genes). Each panel cites
# the literature source it is derived from.
#
# Genes are HGNC symbols matching GENCODE v44 annotation.

epithelial:
  genes:   [EPCAM, KRT5, KRT6A, KRT14, KRT13, KRT15, TP63, SOX2, KRT17, KRT19]
  source:  Zhang et al. 2021 Nat Commun, doi:10.1038/s41467-021-25539-x

basal_epithelial:
  genes:   [KRT5, KRT14, TP63, KRT15, ITGA6, ITGB4, COL17A1]
  source:  Yamamoto et al. 2018 Genes Cells, doi:10.1111/gtc.12575

cycling_epithelial:
  genes:   [MKI67, TOP2A, CCNB1, CCNB2, CDK1, MCM2, MCM5, PCNA]
  source:  Tirosh et al. 2016 Science, doi:10.1126/science.aad0501

T_cell:
  genes:   [CD3D, CD3E, CD3G, CD2, TRAC, TRBC1, TRBC2]
  source:  Szabo et al. 2019 Nat Commun, doi:10.1038/s41467-019-12464-3

CD8_T:
  genes:   [CD8A, CD8B, GZMK, GZMA, GZMB, PRF1, NKG7]
  source:  Szabo et al. 2019

CD4_T:
  genes:   [CD4, IL7R, CCR7, FOXP3, IL2RA, CTLA4]
  source:  Szabo et al. 2019

B_cell:
  genes:   [CD19, CD79A, CD79B, MS4A1, IGHM, IGHD]
  source:  Andor et al. 2019 Genome Med, doi:10.1186/s13073-019-0682-2

plasma:
  genes:   [JCHAIN, MZB1, IGHA1, IGHG1, XBP1, IGKC]
  source:  Wang et al. 2019 Cell, doi:10.1016/j.cell.2019.04.044

NK:
  genes:   [KLRF1, KLRD1, NKG7, GNLY, FCGR3A, NCAM1]
  source:  Crinier et al. 2018 Immunity, doi:10.1016/j.immuni.2018.10.009

myeloid:
  genes:   [CD68, CD14, FCGR3A, LYZ, S100A8, S100A9, MARCO]
  source:  Zilionis et al. 2019 Immunity, doi:10.1016/j.immuni.2019.03.009

dendritic:
  genes:   [CLEC9A, IRF8, BATF3, FCER1A, CD1C, LAMP3]
  source:  Villar et al. 2017 Science, doi:10.1126/science.aah4573

fibroblast:
  genes:   [COL1A1, COL1A2, COL3A1, ACTA2, PDGFRA, PDGFRB, FAP]
  source:  Lambrechts et al. 2018 Nat Med, doi:10.1038/s41591-018-0096-5

endothelial:
  genes:   [PECAM1, VWF, CDH5, KDR, FLT1, CD34]
  source:  Goveia et al. 2020 Cancer Cell, doi:10.1016/j.ccell.2019.12.001

mast:
  genes:   [TPSAB1, TPSB2, KIT, CPA3, MS4A2]
  source:  Dwyer et al. 2016 Nat Immunol, doi:10.1038/ni.3445
